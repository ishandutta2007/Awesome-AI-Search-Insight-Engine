<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
        50% { opacity: 0.8; stroke-dashoffset: 40; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 8px #a855f7); }
      }
      @keyframes scanLine {
        0% { transform: translateY(-20px); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(380px); opacity: 0; }
      }
      .bg-grid { opacity: 0.15; stroke: #64748b; stroke-width: 1; }
      .animated-beam { stroke-dasharray: 8 8; animation: pulseBeam 4s linear infinite; }
      .node { animation: nodePulse 3s ease-in-out infinite; transform-origin: center; }
      .node-delay-1 { animation-delay: 0.6s; }
      .node-delay-2 { animation-delay: 1.2s; }
      .node-delay-3 { animation-delay: 1.8s; }
      .card-float { animation: floatSlow 6s ease-in-out infinite; }
      .title-text { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-weight: 800; }
      .body-text { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid Background Pattern -->
  <g class="bg-grid">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200 M0 320 H1200 M0 360 H1200" />
    <path d="M60 0 V400 M120 0 V400 M180 0 V400 M240 0 V400 M300 0 V400 M360 0 V400 M420 0 V400 M480 0 V400 M540 0 V400 M600 0 V400 M660 0 V400 M720 0 V400 M780 0 V400 M840 0 V400 M900 0 V400 M960 0 V400 M1020 0 V400 M1080 0 V400 M1140 0 V400" />
  </g>

  <!-- Glowing Ambient Orbs in Background -->
  <circle cx="150" cy="100" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="200" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="160" fill="#3b82f6" opacity="0.1" filter="url(#glow)"/>

  <!-- Dynamic Network Connection Beams (Background Graph Element) -->
  <g stroke="url(#accentGrad1)" stroke-width="2" class="animated-beam" opacity="0.5">
    <line x1="120" y1="320" x2="280" y2="340" />
    <line x1="280" y1="340" x2="450" y2="310" />
    <line x1="750" y1="330" x2="920" y2="350" />
    <line x1="920" y1="350" x2="1080" y2="310" />
  </g>

  <!-- Background Animated Dynamic Nodes (Keep below text overlay layer) -->
  <g opacity="0.7">
    <circle cx="120" cy="320" r="6" fill="#818cf8" class="node"/>
    <circle cx="280" cy="340" r="8" fill="#c084fc" class="node node-delay-1"/>
    <circle cx="450" cy="310" r="5" fill="#f472b6" class="node node-delay-2"/>
    <circle cx="750" cy="330" r="7" fill="#60a5fa" class="node node-delay-3"/>
    <circle cx="920" cy="350" r="9" fill="#34d399" class="node node-delay-1"/>
    <circle cx="1080" cy="310" r="6" fill="#a78bfa" class="node node-delay-2"/>
  </g>

  <!-- Subtle Animated Scanner Effect -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGrad1)" stroke-width="3" opacity="0.4" class="card-float">
    <animateTransform attributeName="transform" type="translate" values="0,20; 0,380; 0,20" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- Foreground Main Title & Subtitle Container (Guaranteed Sharp Visibility) -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Main Headline Accent Glow Box -->
    <rect x="-420" y="-75" width="840" height="90" rx="20" fill="url(#cardGrad)" stroke="url(#accentGrad1)" stroke-width="1.5" filter="url(#subtleGlow)"/>

    <!-- Main Title Text -->
    <text y="-22" class="title-text" font-size="42" fill="#ffffff" letter-spacing="1.5">
      AWESOME AI SEARCH &amp; INSIGHT ENGINE
    </text>
    
    <!-- Subtitle / Tagline Text -->
    <text y="22" class="body-text" font-size="19" fill="#94a3b8" font-weight="500" letter-spacing="0.8">
      Top SaaS Platforms &amp; Open-Source RAG, Vector &amp; Semantic Retrieval Systems
    </text>
  </g>

  <!-- Floating Dynamic Feature Pills (Foreground Layer Below Title) -->
  <g transform="translate(600, 285)" text-anchor="middle">
    <!-- Pill 1: Hybrid Search -->
    <g transform="translate(-360, 0)" class="card-float">
      <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
      <text y="6" class="body-text" font-size="14" fill="#e2e8f0" font-weight="600">⚡ Hybrid Search</text>
    </g>

    <!-- Pill 2: RAG Citations -->
    <g transform="translate(-180, 0)" class="card-float" style="animation-delay: 0.5s;">
      <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <text y="6" class="body-text" font-size="14" fill="#e2e8f0" font-weight="600">🧠 RAG &amp; Citations</text>
    </g>

    <!-- Pill 3: Enterprise Search -->
    <g transform="translate(0, 0)" class="card-float" style="animation-delay: 1s;">
      <rect x="-95" y="-22" width="190" height="44" rx="22" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <text y="6" class="body-text" font-size="14" fill="#e2e8f0" font-weight="600">🏢 Enterprise Search</text>
    </g>

    <!-- Pill 4: Vector Databases -->
    <g transform="translate(180, 0)" class="card-float" style="animation-delay: 1.5s;">
      <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text y="6" class="body-text" font-size="14" fill="#e2e8f0" font-weight="600">🔍 Vector Search</text>
    </g>

    <!-- Pill 5: Knowledge Graphs -->
    <g transform="translate(360, 0)" class="card-float" style="animation-delay: 2s;">
      <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text y="6" class="body-text" font-size="14" fill="#e2e8f0" font-weight="600">🌐 Insight Engines</text>
    </g>
  </g>

  <!-- Top & Bottom Border Highlights -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad1)"/>
  <rect x="0" y="396" width="1200" height="4" fill="url(#accentGrad2)"/>
</svg>
